    .gallery-img-wrap { width: 100%; height: 260px; overflow: hidden; background: #f0f0f0; }
    .gallery-img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s cubic-bezier(0.165, 0.84, 0.44, 1); }
    .gallery-card:hover .gallery-img-wrap img { transform: scale(1.08); }

  <!-- Modal for Gallery -->
  <div id="galleryModal" class="modal" style="display:none; position:fixed; z-index:9999; left:0; top:0; width:100%; height:100%; background-color:rgba(8, 25, 60, 0.9); align-items:center; justify-content:center; flex-direction:column;">
    <span onclick="document.getElementById('galleryModal').style.display='none'" style="position:absolute; top:20px; right:40px; color:white; font-size:40px; cursor:pointer; font-weight:bold;">&times;</span>
    <img id="modalImg" style="max-width:90%; max-height:80vh; border:2px solid white; border-radius:4px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
    <div id="modalCaption" style="color:white; margin-top:20px; font-size:1.3rem; font-weight:600; text-align:center;"></div>
  </div>

  <script>
    document.querySelectorAll('.gallery-card').forEach(card => {
      card.addEventListener('click', e => {
        e.preventDefault();
        const href = card.getAttribute('href');
        const caption = card.querySelector('h3') ? card.querySelector('h3').innerText : '';
        const modal = document.getElementById('galleryModal');
        const modalImg = document.getElementById('modalImg');
        const modalCaption = document.getElementById('modalCaption');
        
        modal.style.display = 'flex';
        modalImg.src = href;
        modalCaption.innerText = caption;
      });
    });
  </script>
