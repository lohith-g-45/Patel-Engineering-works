<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Recognitions, certifications and quality standards maintained by Patel Engineering Works.">
  <title>Certifications & Accreditations — Patel Engineering Works (Vizag)</title>
  <link rel="stylesheet" href="/static/css/styles.css">
  <style>
    /* Strict Client Adherence Styles for Certifications */
    .cert-hero {
      background: linear-gradient(rgba(8,25,60,0.65), rgba(8,25,60,0.65)), url('/static/assets/images/new_hero_general.png');
      background-size: cover;
      background-position: center;
      padding: 140px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      width: 100%;
    }
    .cert-hero .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
    }
    .cert-hero h1 {
      color: #ffffff;
      font-size: clamp(2.5rem, 4vw, 3.5rem);
      font-weight: 700;
      margin-bottom: 1rem;
      font-family: var(--font-heading, sans-serif);
      text-align: center;
    }
    .cert-hero p {
      color: rgba(255,255,255,0.9);
      font-size: clamp(1.1rem, 2vw, 1.3rem);
      max-width: 800px;
      margin: 0 auto;
      font-weight: 400;
      text-align: center;
    }
    
    .cert-section {
      padding: 120px 0;
      background-color: #f8f9fb; /* Light Gray */
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .cert-heading-wrap {
      text-align: center;
      margin-bottom: 4rem;
    }
    
    .cert-heading-wrap h2 {
      font-size: 2rem;
      color: #16356d;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .cert-showcase {
      max-width: 900px; /* Increased size to make it the absolute primary focus */
      width: 100%;
      margin: 0 auto;
      text-align: center;
    }
    
    .cert-img {
      width: 100%;
      height: auto;
      display: block;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      box-shadow: 0 16px 40px rgba(22, 53, 109, 0.15); /* Strong shadow for depth */
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      background-color: #ffffff;
      padding: 1rem; /* Frame effect */
    }
    
    .cert-img:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 50px rgba(22, 53, 109, 0.2);
    }
    
    .cert-caption {
      margin-top: 1.5rem;
      font-size: 0.95rem;
      color: #555555;
      font-style: italic;
      text-align: center;
    }
    
    /* Footer Enforcement */
    footer, .site-footer {
      background-color: #16356d !important; /* Dark Navy */
    }
    footer *, .site-footer * {
      color: #ffffff !important;
    }
    footer a:hover, .site-footer a:hover {
      opacity: 0.8 !important;
    }
  </style>
</head>
<body>
  <!-- SECTION 1: NAVIGATION -->
  {% include "_navbar.html" %}

  <!-- SECTION 1 (cont): HERO BANNER -->
  <section class="cert-hero">
    <div class="container">
      <h1>Certifications &amp; Accreditations</h1>
      <p>Recognitions, certifications and quality standards maintained by Patel Engineering Works.</p>
    </div>
  </section>

  <!-- SECTION 2: LARGE CENTERED CERTIFICATE -->
  <section class="cert-section">
    <div class="container">
      <div class="cert-heading-wrap">
        <h2>Certifications &amp; Accreditations</h2>
      </div>
      
      <div class="cert-showcase">
        <a href="/static/assets/images/certificate_.jpeg" target="_blank" title="Click to enlarge">
          <img src="/static/assets/images/certificate_.jpeg" alt="Certificate of Appreciation - INS Vikrant" class="cert-img">
        </a>
        <div class="cert-caption">Certificate of Appreciation – INS Vikrant</div>
      </div>
    </div>
  </section>

  <!-- SECTION 3: FOOTER -->
  {% include '_footer.html' %}
  
  <script src="/static/js/main.js"></script>
</body>
</html>
