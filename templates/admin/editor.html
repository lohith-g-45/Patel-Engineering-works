<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Article Editor - Patel Engineering Works">
  <title>Article Editor - PEW Vizag</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}?v=20260319-admin-editor">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');
  </style>
  <style>
    body {
      background: radial-gradient(circle at top, rgba(255, 255, 255, 0.96) 0%, rgba(243, 246, 251, 0.96) 45%, rgba(231, 238, 249, 0.9) 100%);
      font-family: 'Space Grotesk', sans-serif;
    }

    .editor-header {
      background: rgba(255, 255, 255, 0.82);
      color: #16213b;
      padding: 0.9rem 0;
      border-bottom: 1px solid rgba(23, 43, 82, 0.12);
      box-shadow: 0 12px 30px rgba(12, 26, 61, 0.1);
      backdrop-filter: blur(16px);
    }

    .editor-header .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1.5rem;
    }

    .editor-brand {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .editor-brand img {
      width: 140px;
    }

    .editor-title {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 600;
      color: #16213b;
    }

    .editor-kicker {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #6a7a98;
      margin-bottom: 1.25rem;
    }

    .editor-kicker img {
      width: 18px;
      height: 18px;
    }

    .btn-back {
      background: rgba(42, 91, 215, 0.1);
      color: #2a5bd7;
      border: 1px solid rgba(42, 91, 215, 0.25);
      padding: 0.5rem 1rem;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 500;
      transition: all 0.3s;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
    }

    .btn-back:hover {
      background: rgba(42, 91, 215, 0.2);
    }

    .editor-container {
      padding: 2rem 0;
      max-width: 900px;
      margin: 0 auto;
    }

    .editor-card {
      background: rgba(255, 255, 255, 0.92);
      padding: 2.2rem;
      border-radius: 16px;
      border: 1px solid rgba(23, 43, 82, 0.12);
      box-shadow: 0 14px 30px rgba(12, 26, 61, 0.12);
      backdrop-filter: blur(12px);
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: #1c2a4a;
      font-weight: 600;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid rgba(22, 38, 69, 0.16);
      border-radius: 10px;
      font-size: 1rem;
      font-family: inherit;
      transition: border-color 0.3s;
      background: rgba(255, 255, 255, 0.85);
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: #2a5bd7;
      box-shadow: 0 0 0 3px rgba(42, 91, 215, 0.12);
    }

    .form-group textarea {
      min-height: 300px;
      resize: vertical;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .form-actions {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(23, 43, 82, 0.12);
    }

    .btn-primary {
      background: linear-gradient(135deg, #2a5bd7 0%, #6aa2ff 100%);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.3s;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(42, 91, 215, 0.35);
    }

    .btn-primary:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.9);
      color: #1c2a4a;
      border: 1px solid rgba(23, 43, 82, 0.12);
      padding: 0.75rem 1.5rem;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.3s;
    }

    .btn-secondary:hover {
      background: rgba(42, 91, 215, 0.08);
    }

    .message {
      padding: 1rem;
      border-radius: 10px;
      margin-bottom: 1.5rem;
      display: none;
    }

    .message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .message.show {
      display: block;
    }

    .loader {
      display: none;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .btn-primary.loading {
      position: relative;
      color: transparent;
    }

    .btn-primary.loading .loader {
      display: block;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    .form-hint {
      font-size: 0.875rem;
      color: #8090ab;
      margin-top: 0.25rem;
    }

    .image-preview-list {
      display: none;
      margin-top: 0.75rem;
      gap: 0.65rem;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-items: start;
      width: 100%;
    }

    .image-preview-list.visible {
      display: grid !important;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      margin-bottom: 1.25rem;
    }

    .image-preview {
      display: none;
      border-radius: 12px;
      border: 1px solid rgba(23, 43, 82, 0.12);
      overflow: hidden;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 10px 24px rgba(12, 26, 61, 0.12);
      width: 100%;
      aspect-ratio: 1 / 1;
      position: relative;
    }

    .image-preview.visible {
      display: block;
    }

    .image-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: rgba(240, 244, 252, 0.8);
      cursor: zoom-in;
    }

    .image-lightbox {
      position: fixed;
      inset: 0;
      background: rgba(8, 16, 34, 0.82);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 3000;
      padding: 2rem;
    }

    .image-lightbox.active {
      display: flex;
    }

    .image-lightbox img {
      max-width: min(960px, 90vw);
      max-height: 80vh;
      width: auto;
      height: auto;
      border-radius: 16px;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.4);
    }

    .image-lightbox button {
      position: absolute;
      top: 2rem;
      right: 2rem;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.4);
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .image-preview-caption {
      display: none;
      padding: 0.25rem 0.4rem;
      font-size: 0.65rem;
      color: #6a7a98;
    }

    .image-preview-actions {
      display: flex;
      justify-content: flex-end;
      position: absolute;
      top: 2px;
      right: 2px;
    }


    .btn-remove-image {
      background: rgba(225, 86, 90, 0.12);
      color: #c8484c;
      border: 1px solid rgba(225, 86, 90, 0.35);
      width: 35%;
      aspect-ratio: 1 / 1;
      min-width: 28px;
      max-width: 46px;
      padding: 0;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.92rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.2rem;
    }

    .btn-remove-image img {
      width: 56%;
      height: 56%;
    }

    @media (max-width: 768px) {
      .editor-header .container {
        flex-direction: column;
        gap: 1rem;
      }

      .editor-brand {
        flex-direction: column;
      }

      .form-row {
        grid-template-columns: 1fr;
      }

      .form-actions {
        flex-direction: column;
      }

      .btn-primary, .btn-secondary {
        width: 100%;
      }

      .image-preview-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .image-preview-list.visible {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 460px) {
      .image-preview-list {
        grid-template-columns: 1fr;
      }

      .image-preview-list.visible {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="editor-header">
    <div class="container">
      <div class="editor-brand">
        <img src="{{ url_for('static', filename='images/pew-vizag-logo.svg') }}" alt="Patel Engineering Works logo">
        <h1 class="editor-title" id="pageTitle">Add Article</h1>
      </div>
      <button class="btn-back" onclick="window.history.back()">
        <img src="{{ url_for('static', filename='icons/layout-dashboard.svg') }}" alt="">
        Back
      </button>
    </div>
  </div>

  <section class="editor-container">
    <div class="editor-card">
      <div class="message" id="messageBox"></div>

      <div class="editor-kicker">
        <img src="{{ url_for('static', filename='icons/edit.svg') }}" alt="">
        Article Composer
      </div>

      <form id="articleForm">
        <div class="form-group">
          <label for="title">Article Title</label>
          <input
            type="text"
            id="title"
            name="title"
            required
            placeholder="Enter article title"
          >
          <p class="form-hint">The main heading for your article</p>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category" required>
              <option value="">-- Select Category --</option>
              <option value="Blog">Blog</option>
              <option value="News">News</option>
              <option value="Press Release">Press Release</option>
              <option value="Case Study">Case Study</option>
            </select>
          </div>
          <div class="form-group">
            <label for="imageFile">Upload Image From Computer</label>
            <input
              type="file"
              id="imageFile"
              name="imageFile"
              multiple
              accept="image/png,image/jpeg,image/jpg,image/gif,image/webp"
            >
            <p class="form-hint" id="imageUploadHint">You can add 3 more images.</p>
          </div>
        </div>

        <div class="image-preview-list" id="imagePreviewList"></div>

        <div class="form-group">
          <label for="content">Article Content</label>
          <textarea
            id="content"
            name="content"
            required
            placeholder="Write your article content here... (supports plain text and basic HTML)"
          ></textarea>
          <p class="form-hint">You can use HTML tags (p, h2, h3, strong, em, ul, li, etc.)</p>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-primary" id="submitBtn">
            <span>Save Article</span>
            <div class="loader"></div>
          </button>
          <button type="button" class="btn-secondary" onclick="window.location.href='/admin/dashboard'">
            Cancel
          </button>
        </div>
      </form>
    </div>
  </section>

  <div class="image-lightbox" id="imageLightbox" aria-hidden="true">
    <button type="button" id="imageLightboxClose" aria-label="Close preview">×</button>
    <img id="imageLightboxImg" src="" alt="Full size preview">
  </div>

  <script>
    // Check authentication
    function checkAuth() {
      const token = localStorage.getItem('admin_token');
      if (!token) {
        window.location.href = '/admin';
        return;
      }
      return token;
    }

    // Get article ID from URL
    const urlParams = new URLSearchParams(window.location.search);
    const articleId = urlParams.get('id');
    const imagePreviewList = document.getElementById('imagePreviewList');
    const imageFileInput = document.getElementById('imageFile');
    const imageUploadHint = document.getElementById('imageUploadHint');
    const imageLightbox = document.getElementById('imageLightbox');
    const imageLightboxImg = document.getElementById('imageLightboxImg');
    const imageLightboxClose = document.getElementById('imageLightboxClose');
    const submitBtn = document.getElementById('submitBtn');
    let selectedFiles = [];
    let existingImageUrls = [];

    function updateFileInput() {
      const dataTransfer = new DataTransfer();
      selectedFiles.forEach((file) => dataTransfer.items.add(file));
      imageFileInput.files = dataTransfer.files;
    }

    function setSubmitDisabled(disabled) {
      if (!submitBtn || submitBtn.classList.contains('loading')) return;
      submitBtn.disabled = disabled;
    }

    function updateImageUploadHint() {
      if (!imageUploadHint) return;
      const maxImages = 3;
      const remaining = Math.max(0, maxImages - selectedFiles.length);
      if (remaining === 0) {
        imageUploadHint.textContent = 'Image upload limit reached (3 of 3).';
        return;
      }
      const noun = remaining === 1 ? 'image' : 'images';
      imageUploadHint.textContent = `You can add ${remaining} more ${noun}.`;
    }

    function renderImagePreviews() {
      if (!imagePreviewList) return;
      const previews = [];
      existingImageUrls.forEach((url, index) => {
        previews.push({
          src: url,
          label: `Current image ${index + 1}`,
          source: 'existing',
          index,
        });
      });
      selectedFiles.forEach((file, index) => {
        previews.push({
          src: URL.createObjectURL(file),
          label: `File: ${file.name}`,
          source: 'file',
          index,
        });
      });

      imagePreviewList.innerHTML = '';
      if (!previews.length) {
        imagePreviewList.classList.remove('visible');
        updateImageUploadHint();
        setSubmitDisabled(false);
        return;
      }

      previews.forEach((preview) => {
        const item = document.createElement('div');
        item.className = 'image-preview visible';
        const removeButton = preview.source === 'file' ? `
          <div class="image-preview-actions">
            <button type="button" class="btn-remove-image" data-remove-source="${preview.source}" data-remove-index="${preview.index}" aria-label="Remove image">
              <img src="{{ url_for('static', filename='icons/trash-x.svg') }}" alt="">
            </button>
          </div>
        ` : '';
        item.innerHTML = `
          <img src="${preview.src}" alt="Preview" data-preview-source="${preview.source}" data-preview-index="${preview.index}">
          <div class="image-preview-caption">${preview.label}</div>
          ${removeButton}
        `;
        imagePreviewList.appendChild(item);
      });

      imagePreviewList.classList.add('visible');
      if (selectedFiles.length > 3) {
        showMessage('Maximum of 3 images allowed.', 'error');
        setSubmitDisabled(true);
      } else {
        setSubmitDisabled(false);
      }
      updateImageUploadHint();
    }

    // Load article data if editing
    async function loadArticle() {
      if (!articleId) return;

      try {
        const response = await fetch(`/api/articles/${articleId}`);
        if (!response.ok) throw new Error('Article not found');

        const article = await response.json();
        document.getElementById('title').value = article.title;
        document.getElementById('category').value = article.category;
        document.getElementById('content').value = article.content;
        if (Array.isArray(article.image_urls) && article.image_urls.length) {
          existingImageUrls = article.image_urls.slice(0, 3);
        } else if (article.image_url) {
          existingImageUrls = [article.image_url];
        }
        renderImagePreviews();
        document.getElementById('pageTitle').textContent = '✏️ Edit Article';
        document.getElementById('submitBtn').innerHTML = '<span>Update Article</span><div class="loader"></div>';
      } catch (error) {
        showMessage(error.message, 'error');
      }
    }

    imageFileInput.addEventListener('change', () => {
      const incomingFiles = Array.from(imageFileInput.files);
      if (!incomingFiles.length) return;

      const existingKeys = new Set(
        selectedFiles.map((file) => `${file.name}-${file.size}-${file.lastModified}`)
      );
      incomingFiles.forEach((file) => {
        const key = `${file.name}-${file.size}-${file.lastModified}`;
        if (!existingKeys.has(key)) {
          selectedFiles.push(file);
          existingKeys.add(key);
        }
      });

      if (selectedFiles.length > 3) {
        selectedFiles = selectedFiles.slice(0, 3);
        showMessage('Maximum of 3 images allowed.', 'error');
      }
      updateFileInput();
      renderImagePreviews();
    });

    imagePreviewList.addEventListener('click', (event) => {
      const removeBtn = event.target.closest('[data-remove-source]');
      if (removeBtn) {
        const source = removeBtn.dataset.removeSource;
        const index = Number(removeBtn.dataset.removeIndex);
        if (source === 'file') {
          selectedFiles.splice(index, 1);
          updateFileInput();
          renderImagePreviews();
        }
        return;
      }

      const previewImg = event.target.closest('img[data-preview-source]');
      if (previewImg && imageLightbox && imageLightboxImg) {
        imageLightboxImg.src = previewImg.src;
        imageLightbox.classList.add('active');
        imageLightbox.setAttribute('aria-hidden', 'false');
      }
    });

    if (imageLightbox && imageLightboxImg && imageLightboxClose) {
      imageLightboxClose.addEventListener('click', () => {
        imageLightbox.classList.remove('active');
        imageLightbox.setAttribute('aria-hidden', 'true');
      });

      imageLightbox.addEventListener('click', (event) => {
        if (event.target === imageLightbox) {
          imageLightbox.classList.remove('active');
          imageLightbox.setAttribute('aria-hidden', 'true');
        }
      });
    }

    // Show message
    function showMessage(message, type = 'error') {
      const messageBox = document.getElementById('messageBox');
      messageBox.textContent = message;
      messageBox.className = `message ${type} show`;
      
      if (type === 'success') {
        setTimeout(() => {
          window.location.href = '/admin/dashboard';
        }, 1500);
      }
    }

    // Handle form submission
    document.getElementById('articleForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const token = checkAuth();
      const submitBtn = document.getElementById('submitBtn');
      if (selectedFiles.length > 3) {
        showMessage('Please limit to 3 images total.', 'error');
        return;
      }
      
      const imageFileInput = document.getElementById('imageFile');
      const formData = new FormData();
      formData.append('title', document.getElementById('title').value);
      formData.append('content', document.getElementById('content').value);
      formData.append('category', document.getElementById('category').value);
      if (imageFileInput.files && imageFileInput.files.length) {
        Array.from(imageFileInput.files).forEach((file) => {
          formData.append('image_files', file);
        });
      }

      submitBtn.disabled = true;
      submitBtn.classList.add('loading');

      try {
        const method = articleId ? 'PUT' : 'POST';
        const url = articleId ? `/api/articles/${articleId}` : '/api/articles';

        const response = await fetch(url, {
          method,
          headers: {
            'Authorization': `Bearer ${token}`
          },
          body: formData
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || 'Failed to save article');
        }

        showMessage(
          articleId ? 'Article updated successfully!' : 'Article created successfully!',
          'success'
        );
      } catch (error) {
        showMessage(error.message, 'error');
        submitBtn.disabled = false;
        submitBtn.classList.remove('loading');
      }
    });

    // Initialize
    checkAuth();
    updateImageUploadHint();
    loadArticle();
  </script>
</body>
</html>
