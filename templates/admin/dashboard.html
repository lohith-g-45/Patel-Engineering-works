<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Admin Dashboard - Patel Engineering Works">
  <title>Admin Dashboard - PEW Vizag</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}?v=20260322-admin-sync">
  <style>
    body {
      background: radial-gradient(circle at top, rgba(255, 255, 255, 0.96) 0%, rgba(243, 246, 251, 0.96) 45%, rgba(231, 238, 249, 0.9) 100%);
    }

    .admin-header {
      background: rgba(255, 255, 255, 0.82);
      color: #16213b;
      padding: 0;
      border-bottom: 1px solid rgba(23, 43, 82, 0.12);
      box-shadow: 0 12px 30px rgba(12, 26, 61, 0.1);
      backdrop-filter: blur(16px);
      position: sticky;
      top: 0;
      z-index: 1100;
    }

    .admin-header .navbar-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1.5rem;
      min-height: 74px;
    }

    .admin-brand {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .admin-brand img {
      width: 140px;
    }

    .admin-title {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 600;
      color: #16213b;
    }

    .admin-user-info {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .admin-user {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-weight: 600;
      color: #1c2a4a;
    }

    .admin-user img {
      width: 18px;
      height: 18px;
    }

    .dashboard-kicker {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #6a7a98;
      margin-bottom: 1.25rem;
    }

    .dashboard-kicker img {
      width: 18px;
      height: 18px;
    }

    .btn-logout {
      background: rgba(42, 91, 215, 0.1);
      color: #2a5bd7;
      border: 1px solid rgba(42, 91, 215, 0.25);
      padding: 0.5rem 1rem;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 500;
      transition: all 0.3s;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn-logout img {
      width: 16px;
      height: 16px;
    }

    .btn-logout:hover {
      background: rgba(42, 91, 215, 0.2);
    }

    .dashboard-container {
      padding: 2rem 0;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.9);
      padding: 1.6rem;
      border-radius: 16px;
      border: 1px solid rgba(23, 43, 82, 0.12);
      box-shadow: 0 14px 30px rgba(12, 26, 61, 0.12);
      backdrop-filter: blur(12px);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .stat-card::after {
      content: '';
      position: absolute;
      right: -40px;
      top: -40px;
      width: 120px;
      height: 120px;
      background: radial-gradient(circle, rgba(42, 91, 215, 0.12), rgba(42, 91, 215, 0));
    }

    .stat-icon {
      width: 40px;
      height: 40px;
      margin: 0 auto 0.75rem;
      border-radius: 12px;
      background: rgba(42, 91, 215, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stat-icon img {
      width: 20px;
      height: 20px;
    }

    .stat-card h3 {
      color: #6a7a98;
      font-size: 0.875rem;
      font-weight: 500;
      margin: 0 0 0.5rem 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-card .number {
      font-size: 2.5rem;
      font-weight: bold;
      color: #2a5bd7;
      margin: 0;
    }

    .btn-group {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
      flex-wrap: wrap;
    }

    .btn-primary {
      background: linear-gradient(135deg, #2a5bd7 0%, #6aa2ff 100%);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.3s;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(42, 91, 215, 0.35);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.9);
      color: #1c2a4a;
      border: 1px solid rgba(23, 43, 82, 0.12);
      padding: 0.75rem 1.5rem;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.3s;
    }

    .btn-secondary:hover {
      background: rgba(42, 91, 215, 0.08);
    }

    .section-title {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      color: #333;
    }

    .history-section {
      background: rgba(255, 255, 255, 0.9);
      padding: 2rem;
      border-radius: 16px;
      border: 1px solid rgba(23, 43, 82, 0.12);
      box-shadow: 0 14px 30px rgba(12, 26, 61, 0.12);
      backdrop-filter: blur(12px);
    }

    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .history-actions {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }

    .btn-clear {
      background: rgba(225, 86, 90, 0.12);
      color: #c8484c;
      border: 1px solid rgba(225, 86, 90, 0.35);
      padding: 0.5rem 1rem;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.3s;
    }

    .btn-clear img {
      width: 14px;
      height: 14px;
    }

    .btn-clear:hover {
      background: rgba(225, 86, 90, 0.2);
    }

    .history-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }

    .history-table thead {
      background: rgba(42, 91, 215, 0.06);
    }

    .history-table th {
      padding: 1rem;
      text-align: left;
      font-weight: 600;
      color: #41506d;
      border-bottom: 1px solid rgba(23, 43, 82, 0.12);
    }

    .history-table td {
      padding: 1rem;
      border-bottom: 1px solid rgba(23, 43, 82, 0.08);
      color: #51607d;
    }

    .action-badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .action-badge.create {
      background: #d4edda;
      color: #155724;
    }

    .action-badge.update {
      background: #cce5ff;
      color: #004085;
    }

    .action-badge.delete {
      background: #f8d7da;
      color: #721c24;
    }

    .empty-state {
      text-align: center;
      padding: 2rem;
      color: #8090ab;
    }

    .empty-state p {
      margin: 0;
      font-size: 0.875rem;
    }

    @media (max-width: 768px) {
      .admin-header .navbar-container {
        flex-direction: column;
        gap: 1rem;
        padding-top: 0.8rem;
        padding-bottom: 0.8rem;
      }

      .admin-brand {
        flex-direction: column;
      }

      .btn-group {
        flex-direction: column;
      }

      .btn-primary, .btn-secondary {
        width: 100%;
      }

      .history-table {
        font-size: 0.75rem;
      }

      .history-table th, .history-table td {
        padding: 0.75rem;
      }
    }
  </style>
</head>
<body class="admin-page">
  <div class="admin-header navbar scrolled">
    <div class="navbar-container">
      <div class="admin-brand navbar-logo">
        <a href="{{ url_for('home') }}" aria-label="PEW Vizag home">
          <img src="{{ url_for('static', filename='images/pew-vizag-logo.svg') }}" alt="Patel Engineering Works logo">
        </a>
        <h1 class="admin-title">Admin Dashboard</h1>
      </div>
      <div class="admin-user-info">
        <span class="admin-user">
          <img src="{{ url_for('static', filename='icons/user.svg') }}" alt="">
          <span id="adminUsername"></span>
        </span>
        <button class="btn-logout" id="logoutBtn">
          <img src="{{ url_for('static', filename='icons/logout-2.svg') }}" alt="">
          Logout
        </button>
      </div>
    </div>
  </div>

  <section class="dashboard-container">
    <div class="container">
      <div class="dashboard-kicker">
        <img src="{{ url_for('static', filename='icons/layout-dashboard.svg') }}" alt="">
        Dashboard Overview
      </div>
      <div class="dashboard-grid">
        <div class="stat-card">
          <div class="stat-icon">
            <img src="{{ url_for('static', filename='icons/edit.svg') }}" alt="">
          </div>
          <h3>Total Articles</h3>
          <p class="number" id="totalArticles">0</p>
        </div>
        <div class="stat-card">
          <div class="stat-icon">
            <img src="{{ url_for('static', filename='icons/upload.svg') }}" alt="">
          </div>
          <h3>Actions Today</h3>
          <p class="number" id="actionsToday">0</p>
        </div>
        <div class="stat-card">
          <div class="stat-icon">
            <img src="{{ url_for('static', filename='icons/layout-dashboard.svg') }}" alt="">
          </div>
          <h3>Total Actions</h3>
          <p class="number" id="totalActions">0</p>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn-primary" onclick="window.location.href='/admin/add'">+ Add New Article</button>
        <button class="btn-secondary" onclick="window.location.href='/media'">View Media Page</button>
      </div>
    </div>
  </section>

  <section class="dashboard-container">
    <div class="container">
      <div class="history-header">
        <h2 class="section-title">Recent Activity</h2>
        <div class="history-actions">
          <button class="btn-clear" id="clearHistoryBtn">
            <img src="{{ url_for('static', filename='icons/trash-x.svg') }}" alt="">
            Clear History
          </button>
        </div>
      </div>
      <div class="history-section">
        <table class="history-table">
          <thead>
            <tr>
              <th>Action</th>
              <th>Type</th>
              <th>Category</th>
              <th>Details</th>
              <th>Admin</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="historyTableBody">
            <tr>
              <td colspan="6" class="empty-state">
                <p>Loading history...</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>

  <script>
    // Check authentication
    function checkAuth() {
      const token = localStorage.getItem('admin_token');
      const username = localStorage.getItem('admin_username');
      
      if (!token) {
        window.location.href = '/admin';
        return;
      }
      
      if (username) {
        document.getElementById('adminUsername').textContent = username;
      }
    }

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      const token = localStorage.getItem('admin_token');
      
      try {
        await fetch('/api/auth/logout', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });
      } catch (error) {
        console.error('Logout error:', error);
      }
      
      localStorage.removeItem('admin_token');
      localStorage.removeItem('admin_username');
      window.location.href = '/admin';
    });

    // Load stats
    async function loadStats() {
      const token = localStorage.getItem('admin_token');
      
      try {
        // Get articles count
        const articlesRes = await fetch('/api/articles');
        const articlesData = await articlesRes.json();
        document.getElementById('totalArticles').textContent = articlesData.articles.length;

        // Get history
        const historyRes = await fetch('/api/admin/history', {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });
        const historyData = await historyRes.json();
        
        const today = new Date().toDateString();
        const actionsToday = historyData.history.filter(h => 
          new Date(h.created_at).toDateString() === today
        ).length;
        
        document.getElementById('actionsToday').textContent = actionsToday;
        document.getElementById('totalActions').textContent = historyData.history.length;
        
        // Populate history table
        const tbody = document.getElementById('historyTableBody');
        if (historyData.history.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="6" class="empty-state">
                <p>No activity yet</p>
              </td>
            </tr>
          `;
          return;
        }
        
        tbody.innerHTML = historyData.history.map(h => `
          <tr>
            <td><span class="action-badge ${h.action.toLowerCase()}">${h.action}</span></td>
            <td>${h.entity_type}</td>
            <td>${h.category || '-'}</td>
            <td>${h.details}</td>
            <td>${h.admin_username}</td>
            <td>${new Date(h.created_at).toLocaleDateString()} ${new Date(h.created_at).toLocaleTimeString()}</td>
          </tr>
        `).join('');
      } catch (error) {
        console.error('Error loading stats:', error);
      }
    }

    // Clear history
    const clearButton = document.getElementById('clearHistoryBtn');
    if (clearButton) {
      clearButton.addEventListener('click', async () => {
        const token = localStorage.getItem('admin_token');
        if (!token) return;

        const confirmed = window.confirm('Clear all history? This cannot be undone.');
        if (!confirmed) return;

        try {
          const response = await fetch('/api/admin/history', {
            method: 'DELETE',
            headers: {
              'Authorization': `Bearer ${token}`
            }
          });

          if (!response.ok) {
            throw new Error('Failed to clear history');
          }

          await loadStats();
        } catch (error) {
          console.error('Error clearing history:', error);
        }
      });
    }

    // Initialize
    checkAuth();
    loadStats();
    
    // Refresh stats every 30 seconds
    setInterval(loadStats, 30000);
  </script>
</body>
</html>
