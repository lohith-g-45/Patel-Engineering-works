<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Patel Engineering Works</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/lightweight.css') }}">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--bg-color);
    }
    .login-card {
      background: var(--surface-color);
      padding: 3rem;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="login-card shadow-lg">
    <h1 style="margin-bottom: 2rem;">Admin Login</h1>
    <form id="loginForm">
      <div class="form-group" style="text-align: left;">
        <label for="username" class="form-label">Username</label>
        <input type="text" id="username" class="form-control" required>
      </div>
      <div class="form-group" style="text-align: left;">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" class="form-control" required>
      </div>
      <div id="errorMsg" style="color: var(--danger); margin-bottom: 1rem; display: none;"></div>
      <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
    </form>
    <a href="{{ url_for('home') }}" style="display: block; margin-top: 1.5rem; font-size: 0.875rem;">&larr; Back to Website</a>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      
      const data = await res.json();
      if (res.ok) {
        localStorage.setItem('adminToken', data.token);
        window.location.href = '/admin/dashboard';
      } else {
        const err = document.getElementById('errorMsg');
        err.textContent = data.error || 'Login failed';
        err.style.display = 'block';
      }
    });
  </script>
</body>
</html>
