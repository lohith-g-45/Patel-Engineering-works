<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Apply Now - Patel Engineering Works</title> <meta name="description" content="Submit your application to join the Patel Engineering Works team."> <link rel="stylesheet" href="/static/css/styles.css"> <link rel="preconnect" href="https://fonts.googleapis.com"> <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"> </head> <body class="apply-page"> <!-- ==================== NAVIGATION ==================== --> {% include "_navbar.html" %} <!-- ==================== PAGE HEADER ==================== --> <section class="hero page-hero" style="--hero-image: url('/static/assets/images/new_hero_general.png');"> <div class="page-hero-overlay"></div> <div class="hero-content page-hero-content"> <h1 data-word-reveal data-word-reveal-start="120">Job Application</h1> <p data-word-reveal data-word-reveal-start="500" class="section-subtitle">Submit your details to start your journey with us</p> </div> </section> <!-- ==================== APPLICATION FORM ==================== --> <section class="section"> <div class="container" style="max-width: 800px;"> <div class="form-shell"> <div class="text-center" style="margin-bottom: var(--spacing-2xl);"> <h2>Apply Now</h2> <p>Submit your application to join our talented team</p> </div> <form action="/api/submit-application" method="POST"> <!-- Full Name --> <div class="form-group"> <label class="form-label">Full Name *</label> <input type="text" name="fullName" class="form-input" placeholder="John Smith" required> </div> <!-- Email & Phone --> <div class="form-row"> <div class="form-group"> <label class="form-label">Email Address *</label> <input type="email" name="email" class="form-input" placeholder="john@example.com" required> </div> <div class="form-group"> <label class="form-label">Phone Number *</label> <input type="tel" name="phone" class="form-input" placeholder="+91 XXXXX XXXXX" required> </div> </div> <!-- Position Applying For --> <div class="form-group"> <label class="form-label">Position Applying For *</label> <select name="position" id="job-select" class="form-select" required> <option value="">Select a position</option> <option value="sbh10">Electrical Supervisor - Ship Repair (PEWV/SBH10)</option> <option value="sbh05">Project Engineer/Manager - Electrical (PEWV/SBH05)</option> <option value="sbh08">Electrical Engineer - Ship Repair (PEWV/SBH08)</option> <option value="sbh07">Electrician - Ship Repair (PEWV/SBH07)</option> <option value="sbh06">Electrical Supervisor - Ship Building (Electrical Outfitting) (PEWV/SBH06)</option> <option value="sbh09">Project Engineer/Manager (Ship Repair) (PEWV/SBH09)</option> <option value="sbh04">Senior Mechanical Fitter (Marine) (PEWV/SBH04)</option> <option value="sbh03">Engineering Supervisor (PEWV/SBH03)</option> <option value="sbh02">Hull Fabrication - Senior Structural Assistant Manager/Manager (PEWV/SBH02)</option> <option value="sbh01">Hull Fabrication - Structural Supervisor (PEWV/SBH01)</option> <option value="other">Other</option> </select> </div> <!-- Current Company & Designation --> <div class="form-row"> <div class="form-group"> <label class="form-label">Current Company</label> <input type="text" name="currentCompany" class="form-input" placeholder="Your current employer"> </div> <div class="form-group"> <label class="form-label">Current Designation</label> <input type="text" name="currentDesignation" class="form-input" placeholder="Your current job title"> </div> </div> <!-- Experience --> <div class="form-group"> <label class="form-label">Years of Experience *</label> <select name="experience" class="form-select" required> <option value="">Select experience level</option> <option value="0-2">0-2 years (Fresh graduate)</option> <option value="2-5">2-5 years</option> <option value="5-10">5-10 years</option> <option value="10-15">10-15 years</option> <option value="15+">15+ years</option> </select> </div> <!-- Qualifications --> <div class="form-group"> <label class="form-label">Educational Qualification *</label> <select name="qualification" class="form-select" required> <option value="">Select qualification</option> <option value="diploma">Diploma</option> <option value="bachelor">Bachelor's Degree (BE/BTech)</option> <option value="master">Master's Degree (ME/MTech/MBA)</option> <option value="phd">PhD</option> <option value="other">Other</option> </select> </div> <!-- Skills --> <div class="form-group"> <label class="form-label">Relevant Skills/Certifications</label> <textarea name="skills" class="form-textarea" placeholder="List your relevant skills and certifications (e.g., CAD, CATIA, AWS, ISO certifications, etc.)"></textarea> </div> <!-- Resume Upload --> <div class="form-group"> <label class="form-label">Upload Resume/CV *</label> <input type="file" name="resume" class="form-input" accept=".pdf,.doc,.docx" style="padding: var(--spacing-lg);" required> <p style="font-size: var(--font-size-xs); color: var(--text-light); margin-top: var(--spacing-sm); margin-bottom: 0;"> Accepted formats: PDF, DOC, DOCX (Max 5MB) </p> </div> <!-- Cover Letter --> <div class="form-group"> <label class="form-label">Message / Cover Letter</label> <textarea name="message" class="form-textarea" placeholder="Tell us why you're a great fit for this position and what motivates you to join us..."></textarea> </div> <!-- Terms & Conditions --> <div class="form-group"> <label style="display: flex; align-items: start; gap: var(--spacing-md);"> <input type="checkbox" name="terms" style="margin-top: var(--spacing-sm);" required> <span style="color: var(--text-dark);">I agree to the privacy policy and terms of the application process *</span> </label> </div> <!-- Submit Button --> <button type="submit" class="btn btn-primary btn-large btn-block">Submit Application</button> </form> </div> </div> </section> <!-- ==================== FOOTER ==================== --> {% include '_footer.html' %} <!-- Scripts --> <script src="/static/js/main.js"></script> <script> // Pre-select job position from URL query parameter document.addEventListener('DOMContentLoaded', function() { const urlParams = new URLSearchParams(window.location.search); const jobId = urlParams.get('job'); const jobSelect = document.getElementById('job-select'); if (jobId && jobSelect) { // Find if the jobId matches any option value for (let i = 0; i < jobSelect.options.length; i++) { if (jobSelect.options[i].value === jobId) { jobSelect.selectedIndex = i; break; } } } }); </script> </body> </html>
